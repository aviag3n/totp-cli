[package]
name = "totp-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
base32 = "0.5.1"
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
crossterm = { version = "0.29", features = [ "serde" ] }
digest = "0.10.7"
hmac = "0.12.1"
keyring = "3.6.2"
rand = "0.9.1"
serde = {version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
sha = "1.0.3"
sha1 = "0.10.6"
thiserror = "2.0.12"
tui = { version = "0.19.0", default-features = false, features = ['crossterm', 'serde'] }
